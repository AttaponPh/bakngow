<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>บักโหง่ว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F2E9D3;
    --cream-2: #E9DCBB;
    --ink: #3A2A1B;
    --hide: #7C5A3E;
    --hide-dark: #F291BA;
    --rice: #74883F;
    --rice-dark: #566831;
    --sunset: #DE8531;
    --sunset-dark: #B8631F;
    --danger: #A85141;
    --paper: #FBF6E9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--cream);
    font-family: 'Mitr', sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 10%, rgba(124,90,62,0.06) 0, transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(116,136,63,0.08) 0, transparent 50%);
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px 12px;
    background: var(--hide);
    color: var(--paper);
    border-bottom: 4px solid var(--hide-dark);
    position: relative;
    z-index: 2;
  }

  .mascot {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.15));
  }

  .head-text { flex: 1; min-width: 0; }

  .head-text h1 {
    font-family: 'Chonburi', cursive;
    font-size: 22px;
    margin: 0;
    line-height: 1.1;
    letter-spacing: 0.5px;
  }

  .head-text p {
    margin: 3px 0 0;
    font-size: 12px;
    opacity: 0.85;
    font-weight: 300;
  }

  .iq-badge {
    font-size: 11px;
    background: rgba(0,0,0,0.18);
    border-radius: 20px;
    padding: 4px 10px;
    white-space: nowrap;
    font-weight: 300;
  }

  /* ---------- Chat log ---------- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background:
      linear-gradient(var(--cream), var(--cream)) ;
  }

  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: var(--cream-2); border-radius: 10px; }

  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .avatar-sm {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #F4A6C6;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .bubble {
    max-width: 76%;
    padding: 10px 13px;
    font-size: 14.5px;
    line-height: 1.5;
    border-radius: 16px;
    word-wrap: break-word;
    animation: pop 0.18s ease-out;
  }

  @keyframes pop {
    from { transform: scale(0.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .row.bot .bubble {
    background: var(--paper);
    border: 2px solid var(--cream-2);
    border-bottom-left-radius: 4px;
    color: var(--ink);
  }

  .row.user .bubble {
    background: var(--rice);
    color: var(--paper);
    border-bottom-right-radius: 4px;
  }

  .row.teach .bubble {
    background: #FCEFD8;
    border: 2px dashed var(--sunset);
    color: var(--sunset-dark);
    font-size: 13.5px;
  }

  .sys-note {
    text-align: center;
    font-size: 11.5px;
    color: var(--hide);
    opacity: 0.65;
    margin: 4px 0;
  }

  /* ---------- Input area ---------- */
  #inputbar {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--cream-2);
    border-top: 2px solid rgba(0,0,0,0.06);
  }

  #teachMode {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 6px 12px 0;
    font-size: 12px;
    color: var(--sunset-dark);
  }
  #teachMode.active { display: flex; }
  #teachMode button {
    border: none;
    background: none;
    color: var(--hide);
    text-decoration: underline;
    font-family: 'Mitr', sans-serif;
    font-size: 12px;
    cursor: pointer;
    padding: 0;
  }

  #textInput {
    flex: 1;
    border: none;
    border-radius: 20px;
    padding: 11px 16px;
    font-family: 'Mitr', sans-serif;
    font-size: 14.5px;
    background: var(--paper);
    color: var(--ink);
    outline: none;
  }
  #textInput:focus { box-shadow: 0 0 0 2px var(--sunset); }

  #sendBtn {
    border: none;
    background: var(--sunset);
    color: var(--paper);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.1s;
  }
  #sendBtn:active { transform: scale(0.9); }
  #sendBtn:disabled { opacity: 0.5; }

  .typing {
    display: flex;
    gap: 4px;
    padding: 4px 4px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--hide);
    opacity: 0.5;
    animation: bounce 1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4;}
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .stats-bar {
    font-size: 10.5px;
    text-align: center;
    padding: 3px 0 6px;
    color: var(--hide);
    opacity: 0.55;
  }

  /* ---------- Contacts / home screen ---------- */
  #screens {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  #contactsScreen, #app {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transition: transform 0.25s ease;
  }

  #app { transform: translateX(100%); }
  #app.visible { transform: translateX(0); }
  #contactsScreen.hidden { transform: translateX(-100%); }

  #contactsScreen {
    display: flex;
    flex-direction: column;
    background: var(--cream);
  }

  .contacts-header {
    background: var(--hide);
    color: var(--paper);
    padding: 16px 16px 14px;
    border-bottom: 4px solid var(--hide-dark);
  }
  .contacts-header h2 {
    font-family: 'Chonburi', cursive;
    margin: 0 0 10px;
    font-size: 20px;
  }
  .search-fake {
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 12.5px;
    color: rgba(255,255,255,0.75);
  }

  .contacts-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .contact-row:active { background: var(--cream-2); }

  .contact-avatar-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .contact-avatar-wrap svg, .contact-avatar-wrap .placeholder-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
  }
  .placeholder-avatar {
    background: var(--cream-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--hide);
    opacity: 0.5;
  }
  .status-dot {
    position: absolute;
    bottom: 0; right: 0;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--rice);
    border: 2px solid var(--cream);
  }
  .status-dot.offline { background: #B8AC8E; }

  .contact-info { flex: 1; min-width: 0; }
  .contact-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .contact-preview {
    font-size: 12.5px;
    color: var(--hide);
    opacity: 0.75;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .contact-row.disabled .contact-name,
  .contact-row.disabled .contact-preview { opacity: 0.4; }
  .contact-row.disabled { cursor: default; }

  .coming-soon-tag {
    font-size: 9.5px;
    background: var(--cream-2);
    color: var(--hide);
    padding: 2px 7px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  #backBtn {
    background: none;
    border: none;
    color: var(--paper);
    font-size: 22px;
    cursor: pointer;
    padding: 0 8px 0 0;
    line-height: 1;
  }
</style>

</head>

  function normalize(s) {
    return s
      .toLowerCase()
      .replace(/[\s\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]?/g, m => m) // keep tone marks, just trim spaces below
      .replace(/[!?.,ๆฯ๐-๙0-9]/g, '')
      .replace(/\s+/g, '')
      .trim();
  }

  function bigrams(s) {
    const grams = [];
    for (let i = 0; i < s.length - 1; i++) grams.push(s.slice(i, i + 2));
    return grams;
  }

  function similarity(a, b) {
    if (a === b) return 1;
    if (!a.length || !b.length) return 0;
    const ga = bigrams(a), gb = bigrams(b);
    if (!ga.length || !gb.length) return a === b ? 1 : 0;
    let matches = 0;
    const gbCopy = gb.slice();
    for (const g of ga) {
      const idx = gbCopy.indexOf(g);
      if (idx !== -1) { matches++; gbCopy.splice(idx, 1); }
    }
    return (2 * matches) / (ga.length + gb.length);
  }

  function findBestMatch(userText) {
    const norm = normalize(userText);
    if (active.brain[norm]) return { key: norm, score: 1 };
    let best = null, bestScore = 0;
    for (const key of Object.keys(active.brain)) {
      const s = similarity(norm, key);
      if (s > bestScore) { bestScore = s; best = key; }
    }
    if (best && bestScore >= 0.55) return { key: best, score: bestScore };
    return null;
  }

  }

  // ---------- Rendering ----------
  function scrollDown() { log.scrollTop = log.scrollHeight + 200; }

  const miniMascotSvg = '<svg viewBox="0 0 100 100" width="20" height="20" xmlns="http://www.w3.org/2000/svg">'
    + '<ellipse cx="50" cy="60" rx="34" ry="28" fill="#F4A6C6"/>'
    + '<path d="M20 35 Q8 15 22 10 Q28 22 30 34 Z" fill="#E888AF"/>'
    + '<path d="M80 35 Q92 15 78 10 Q72 22 70 34 Z" fill="#E888AF"/>'
    + '<ellipse cx="50" cy="58" rx="26" ry="20" fill="#FAC9DE"/>'
    + '<ellipse cx="38" cy="52" rx="5" ry="6" fill="#D6336C"/>'
    + '<ellipse cx="62" cy="52" rx="5" ry="6" fill="#D6336C"/>'
    + '<ellipse cx="50" cy="68" rx="13" ry="9" fill="#F291BA"/>'
    + '</svg>';

  function addRow(kind, text, opts) {
    opts = opts || {};
    const row = document.createElement('div');
    row.className = 'row ' + kind;
    if (kind === 'bot' || kind === 'teach') {
      const av = document.createElement('div');
      av.className = 'avatar-sm';
      av.innerHTML = miniMascotSvg;
      row.appendChild(av);
    }
    const bub = document.createElement('div');
    bub.className = 'bubble';
    bub.textContent = text;
    row.appendChild(bub);
    log.appendChild(row);
    scrollDown();
    return row;
  }

  function addSysNote(text) {
    const n = document.createElement('div');
    n.className = 'sys-note';
    n.textContent = text;
    log.appendChild(n);
    scrollDown();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    const av = document.createElement('div');
    av.className = 'avatar-sm';
    av.innerHTML = miniMascotSvg;
    row.appendChild(av);
    const bub = document.createElement('div');
    bub.className = 'bubble typing';
    bub.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bub);
    log.appendChild(row);
    scrollDown();
  }

  function removeTyping() {
    const t = document.getElementById('typingRow');
    if (t) t.remove();
  }

  function updateStats() {
    const learnedCount = Object.keys(active.learned).length;
    const iq = Math.min(999, 12 + learnedCount * 2);
    iqBadge.textContent = 'IQ ' + iq;
    statsBar.textContent = active.shared
      ? `${active.name}เรียนรู้เพิ่มจากทุกคนแล้ว ${learnedCount} เรื่อง`
      : `${active.name}จำเรื่องที่มึงสอนไว้ ${learnedCount} เรื่อง (ส่วนตัว)`;
  }

  function rebuildBrain() {
    // seed data lives only in code; learned data is the only part persisted to storage
    active.brain = {};
    for (const q of Object.keys(active.seedBrain)) {
      active.brain[normalize(q)] = active.seedBrain[q];
    }
    for (const k of Object.keys(active.learned)) {
      active.brain[k] = (active.brain[k] || []).concat(active.learned[k]).filter((v, i, a) => a.indexOf(v) === i);
    }
  }

  // ---------- Storage ----------
  // Uses Firebase Firestore: shared across every visitor, persists forever.
  // Falls back to localStorage (per-device only) if Firebase fails to load,
  // so the bot still works even if the database has a hiccup.
  const firebaseConfig = {
    apiKey: "AIzaSyBl68_ERqIgHe3Ol6_FZnH6-9s81vksGCo",
    authDomain: "gen-lang-client-0114259410.firebaseapp.com",
    projectId: "gen-lang-client-0114259410",
    storageBucket: "gen-lang-client-0114259410.firebasestorage.app",
    messagingSenderId: "754374916908",
    appId: "1:754374916908:web:741a93da21896a9045ca89"
  };

  let db = null;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch (e) {
    console.error('Firebase init failed, falling back to localStorage', e);
  }

  async function loadBrain() {
    try {
      if (db) {
        const doc = await db.collection('brains').doc(active.storageKey).get();
        if (doc.exists) {
          active.learned = JSON.parse(doc.data().data || '{}');
        }
      } else {
        const raw = localStorage.getItem(active.storageKey);
        if (raw) active.learned = JSON.parse(raw);
      }
    } catch (e) {
      console.error('load failed', e);
      active.learned = {};
    }
    rebuildBrain();
    updateStats();
  }

  async function saveBrain() {
    try {
      // only ever persist what was actually taught — never the seed set
      if (db) {
        await db.collection('brains').doc(active.storageKey).set({
          data: JSON.stringify(active.learned),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else {
        localStorage.setItem(active.storageKey, JSON.stringify(active.learned));
      }
    } catch (e) {
      console.error('save failed', e);
      addSysNote('บันทึกไม่สำเร็จ แต่' + active.name + 'ยังจำไว้ในเซสชันนี้ได้อยู่');
    }
    updateStats();
  }

  function teachAnswer(normQ, answerRaw) {
    let answer = answerRaw.trim();
    if (containsBadWord(answer)) {
      const rep = randomReplacement();
      addRow('teach', `เดี๋ยวๆ มึงสอนอะไรเนี่ย งงเลย จำเป็น "${rep}" ละกันนะ`);
      answer = rep;
    }
    if (!active.learned[normQ]) active.learned[normQ] = [];
    if (!active.learned[normQ].includes(answer)) active.learned[normQ].push(answer);
    rebuildBrain();
    saveBrain();
  }

  // ---------- Conversation flow ----------
  function enterTeachMode(rawQuestion) {
    active.teachTarget = normalize(rawQuestion);
    teachBar.classList.add('active');
    input.placeholder = `สอน${active.name}ว่าควรตอบว่าอะไร...`;
    input.focus();
  }

  function exitTeachMode() {
    active.teachTarget = null;
    teachBar.classList.remove('active');
    input.placeholder = 'พิมพ์อะไรสักอย่าง...';
  }

  cancelTeachBtn.addEventListener('click', () => {
    addRow('teach', 'โอเค ไม่สอนก็ไม่สอน กูก็ยังงงเหมือนเดิม');
    exitTeachMode();
  });

  // ---------- Basic abuse protection (client-side only — see notes below) ----------
  const MAX_MESSAGE_LENGTH = 200;      // characters
  const MIN_MS_BETWEEN_SENDS = 600;    // debounce accidental double-sends / rapid spam
  const MAX_SENDS_PER_MINUTE = 20;     // soft cap before bákngow tells you to slow down
  let lastSendAt = 0;
  let sendTimestamps = [];

  function isRateLimited() {
    const now = Date.now();
    if (now - lastSendAt < MIN_MS_BETWEEN_SENDS) return 'fast';
    sendTimestamps = sendTimestamps.filter(t => now - t < 60000);
    if (sendTimestamps.length >= MAX_SENDS_PER_MINUTE) return 'flood';
    return false;
  }

  async function handleSend() {
    let text = input.value.trim();
    if (!text) return;

    const limited = isRateLimited();
    if (limited === 'fast') return; // silently ignore accidental double-taps
    if (limited === 'flood') {
      input.value = '';
      addRow('user', text);
      addRow('bot', 'ใจเย็นๆก่อนเว้ย พิมพ์เร็วไปละ กูตามไม่ทัน พักแป๊บนึงนะ');
      return;
    }

    if (text.length > MAX_MESSAGE_LENGTH) {
      text = text.slice(0, MAX_MESSAGE_LENGTH);
      addSysNote(`ข้อความยาวไป ตัดเหลือ ${MAX_MESSAGE_LENGTH} ตัวอักษรให้แล้วนะ`);
    }

    lastSendAt = Date.now();
    sendTimestamps.push(lastSendAt);

    input.value = '';
    addRow('user', text);

    if (active.teachTarget) {
      const target = active.teachTarget;
      exitTeachMode();
      showTyping();
      await new Promise(r => setTimeout(r, 500));
      removeTyping();
      teachAnswer(target, text);
      addRow('bot', 'จำแล้ว! ขอบใจเด้อ คราวหน้าถามแบบนี้กูตอบได้ละ');
      return;
    }

    showTyping();
    await new Promise(r => setTimeout(r, 550 + Math.random() * 400));
    removeTyping();

    const match = findBestMatch(text);
    if (match) {
      const answers = active.brain[match.key];
      const answer = answers[Math.floor(Math.random() * answers.length)];
      addRow('bot', answer);
    } else {
      addRow('bot', 'หา? กูไม่รู้จักคำนี้อ่ะ งงเลย สอนกูหน่อยได้ป่ะว่าควรตอบว่าไง');
      enterTeachMode(text);
    }
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSend();
  });

  // ---------- Screen switching (contacts list <-> chat) ----------
  const appEl = document.getElementById('app');
  const contactsScreen = document.getElementById('contactsScreen');
  const backBtn = document.getElementById('backBtn');
  const mascotSvg = document.getElementById('mascotSvg');
  const headerName = document.getElementById('headerName');
  const headerTagline = document.getElementById('headerTagline');
  const previewText = document.getElementById('previewText');
  const openBtn = document.getElementById('openBakngow');
  let chatInitialized = false;

  function openCharacter() {
    active = characters.bakngow;
    headerName.textContent = active.name;
    headerTagline.textContent = active.tagline;

    appEl.classList.add('visible');
    contactsScreen.classList.add('hidden');

    (async () => {
      if (!chatInitialized) {
        chatInitialized = true;
        addSysNote(active.shared ? `ความรู้ของ${active.name}แชร์กับทุกคนที่เข้ามาเล่น` : `ความรู้ของ${active.name}เก็บไว้ในเครื่องนี้เท่านั้น`);
        await loadBrain();
        addRow('bot', active.greet);
      } else {
        updateStats();
      }
      setTimeout(() => input.focus(), 260);
    })();
  }

  openBtn.addEventListener('click', openCharacter);

  backBtn.addEventListener('click', () => {
    appEl.classList.remove('visible');
    contactsScreen.classList.remove('hidden');
  });

  // keep the contacts-list preview in sync with the latest bot line
  const originalAddRow = addRow;
  addRow = function(kind, text, opts) {
    const row = originalAddRow(kind, text, opts);
    if (kind === 'bot' && previewText) previewText.textContent = text;
    return row;
  };
})();
</script>
</body>
</html>
